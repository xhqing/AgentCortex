<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#0a1628"/>
      <stop offset="100%" stop-color="#050d1a"/>
    </radialGradient>
    <radialGradient id="glowCore" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00e5ff" stop-opacity="0.9"/>
      <stop offset="60%" stop-color="#0091ea" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#01579b" stop-opacity="0"/>
    </radialGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="softGlow">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <circle cx="100" cy="100" r="98" fill="url(#bgGrad)" stroke="#0d47a1" stroke-width="1.5"/>

  <circle cx="100" cy="100" r="50" fill="url(#glowCore)" opacity="0.3"/>

  <g filter="url(#glow)" stroke="#00e5ff" stroke-width="1.5" fill="none" opacity="0.6">
    <circle cx="100" cy="60" r="8"/>
    <circle cx="140" cy="85" r="8"/>
    <circle cx="130" cy="130" r="8"/>
    <circle cx="70" cy="130" r="8"/>
    <circle cx="60" cy="85" r="8"/>
    <circle cx="100" cy="100" r="10"/>
  </g>

  <g stroke="#00b8d4" stroke-width="1.2" opacity="0.5">
    <line x1="100" y1="60" x2="140" y2="85"/>
    <line x1="140" y1="85" x2="130" y2="130"/>
    <line x1="130" y1="130" x2="70" y2="130"/>
    <line x1="70" y1="130" x2="60" y2="85"/>
    <line x1="60" y1="85" x2="100" y2="60"/>
    <line x1="100" y1="60" x2="100" y2="100"/>
    <line x1="140" y1="85" x2="100" y2="100"/>
    <line x1="130" y1="130" x2="100" y2="100"/>
    <line x1="70" y1="130" x2="100" y2="100"/>
    <line x1="60" y1="85" x2="100" y2="100"/>
  </g>

  <g filter="url(#softGlow)" fill="#00e5ff">
    <circle cx="100" cy="60" r="4"/>
    <circle cx="140" cy="85" r="4"/>
    <circle cx="130" cy="130" r="4"/>
    <circle cx="70" cy="130" r="4"/>
    <circle cx="60" cy="85" r="4"/>
    <circle cx="100" cy="100" r="5" fill="#ffffff"/>
  </g>

  <g filter="url(#glow)" stroke="#0091ea" stroke-width="0.8" fill="none" opacity="0.35">
    <circle cx="100" cy="40" r="5"/>
    <circle cx="155" cy="75" r="5"/>
    <circle cx="155" cy="125" r="5"/>
    <circle cx="100" cy="155" r="5"/>
    <circle cx="45" cy="125" r="5"/>
    <circle cx="45" cy="75" r="5"/>
  </g>

  <g stroke="#0091ea" stroke-width="0.6" opacity="0.25">
    <line x1="100" y1="40" x2="100" y2="60"/>
    <line x1="155" y1="75" x2="140" y2="85"/>
    <line x1="155" y1="125" x2="130" y2="130"/>
    <line x1="100" y1="155" x2="100" y2="100"/>
    <line x1="45" y1="125" x2="70" y2="130"/>
    <line x1="45" y1="75" x2="60" y2="85"/>
    <line x1="100" y1="40" x2="155" y2="75"/>
    <line x1="155" y1="75" x2="155" y2="125"/>
    <line x1="155" y1="125" x2="100" y2="155"/>
    <line x1="100" y1="155" x2="45" y2="125"/>
    <line x1="45" y1="125" x2="45" y2="75"/>
    <line x1="45" y1="75" x2="100" y2="40"/>
  </g>

  <g filter="url(#softGlow)" fill="#0091ea" opacity="0.5">
    <circle cx="100" cy="40" r="2.5"/>
    <circle cx="155" cy="75" r="2.5"/>
    <circle cx="155" cy="125" r="2.5"/>
    <circle cx="100" cy="155" r="2.5"/>
    <circle cx="45" cy="125" r="2.5"/>
    <circle cx="45" cy="75" r="2.5"/>
  </g>
</svg>
